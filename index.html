<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Click Blitz</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container py-4" style="max-width: 720px;">

    <!-- Header -->
    <header class="text-center mb-4">
      <h1 class="display-4 fw-bold gradient-title">Click Blitz</h1>
      <p class="text-secondary">Hit the targets before time runs out!</p>
    </header>

    <!-- HUD -->
    <div class="row g-3 justify-content-center mb-4">
      <div class="col-auto">
        <div class="card bg-dark border-secondary text-center px-4 py-2">
          <small class="text-uppercase text-secondary letter-spaced">Score</small>
          <span class="fs-2 fw-bold" id="score">0</span>
        </div>
      </div>
      <div class="col-auto">
        <div class="card bg-dark border-secondary text-center px-4 py-2">
          <small class="text-uppercase text-secondary letter-spaced">Time</small>
          <span class="fs-2 fw-bold text-success" id="timer">30</span>
        </div>
      </div>
      <div class="col-auto">
        <div class="card bg-dark border-secondary text-center px-4 py-2">
          <small class="text-uppercase text-secondary letter-spaced">Best</small>
          <span class="fs-2 fw-bold" id="best">0</span>
        </div>
      </div>
    </div>

    <!-- Arena -->
    <div class="d-flex justify-content-center mb-4">
      <div id="arena">
        <div id="start-screen">
          <h2 class="mb-2">Ready?</h2>
          <p class="text-secondary mb-3">Click as many targets as you can in <strong>30 seconds</strong>.</p>
          <button id="start-btn" class="btn btn-danger btn-lg px-5">Start Game</button>
        </div>
        <div id="end-screen" class="hidden">
          <h2 class="mb-2">Time's up!</h2>
          <p class="text-secondary mb-3">You scored <strong id="final-score">0</strong> points.</p>
          <div class="input-group mb-3" style="max-width: 320px;">
            <input type="text" id="player-name" maxlength="16" placeholder="Your name"
              class="form-control bg-black border-secondary text-white" />
            <button id="save-btn" class="btn btn-success">Save Score</button>
          </div>
          <button id="play-again-btn" class="btn btn-outline-light">Play Again</button>
        </div>
      </div>
    </div>

    <!-- Leaderboard -->
    <section>
      <h2 class="fs-4 fw-semibold border-bottom border-secondary pb-2 mb-3">Leaderboard</h2>
      <table class="table table-dark table-hover table-bordered align-middle">
        <thead class="table-secondary">
          <tr>
            <th>#</th>
            <th>Player</th>
            <th>Score</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body">
          <tr class="empty-row"><td colspan="3" class="text-center text-secondary py-3">No scores yet — be the first!</td></tr>
        </tbody>
      </table>
    </section>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
